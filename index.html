<title>יומן אימונים</title>
  <script type="module" crossorigin src="./assets/index-BsN_onPF.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DXrFVyq-.css">
</head>
<body>
<div id="root"></div>
<script>
// safety net: if the app has not started after 4 seconds, offer a reset of the cached app files (workouts are not deleted)
setTimeout(function () {
  var r = document.getElementById('root');
  if (!r || r.firstChild) return;
  r.innerHTML = '<div style="padding:40px 20px;text-align:center;font:17px/1.5 -apple-system,system-ui,sans-serif"><p>האפליקציה לא נטענה.</p><p><button id="fix" style="font:inherit;padding:14px 22px;border-radius:12px;border:0;background:#ffb224;color:#1a1200;font-weight:700">איפוס קבצי האפליקציה</button></p><p style="opacity:.7;font-size:14px">האימונים שלך לא נמחקים.</p></div>';
  document.getElementById('fix').onclick = async function () {
    try {
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function (g) { return g.unregister(); }));
      var ks = await caches.keys();
      await Promise.all(ks.map(function (k) { return caches.delete(k); }));
    } catch (e) {}
    location.reload();
  };
}, 4000);
</script>
</body>
</html>
